<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projeto de Orientação Profissional - Elias Aguiar de Moraes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom theme tweaks */
    :root {
      --accent-green: #00ff9d;
      --accent-gold: #ffcc00;
    }

    body {
      background: radial-gradient(circle at 30% 30%, #0a0a0a, #000);
      overflow-x: hidden;
    }

    .video-container {
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .video-container.zoomed {
      transform: scale(1.2);
      z-index: 50;
      box-shadow: 0 0 40px var(--accent-green);
    }

    .title-glow {
      text-shadow: 0 0 8px var(--accent-gold), 0 0 20px var(--accent-green);
    }

    .accent-line {
      background: linear-gradient(90deg, var(--accent-green), var(--accent-gold));
    }

    /* Floating particles aesthetic */
    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: var(--accent-green);
      border-radius: 50%;
      opacity: 0.3;
      animation: float 8s infinite ease-in-out;
    }

    @keyframes float {
      0% { transform: translateY(0); opacity: 0.2; }
      50% { transform: translateY(-40px); opacity: 0.8; }
      100% { transform: translateY(0); opacity: 0.2; }
    }
  </style>
</head>

<body class="text-gray-200 font-sans min-h-screen flex flex-col items-center justify-center p-6 relative">

  <!-- floating particles for aesthetic -->
  <div class="particle" style="top:10%; left:15%; animation-delay:0s;"></div>
  <div class="particle" style="top:50%; left:80%; animation-delay:1.2s;"></div>
  <div class="particle" style="top:70%; left:30%; animation-delay:2.1s;"></div>
  <div class="particle" style="top:20%; left:60%; animation-delay:3.5s;"></div>

  <!-- Header -->
  <header class="text-center mb-10 select-none">
    <h1 class="text-4xl md:text-6xl font-bold mb-2 title-glow">Projeto de Orientação Profissional</h1>
    <p class="text-lg tracking-widest text-gray-400">Elias Aguiar de Moraes • 2025</p>
    <div class="accent-line h-1 w-48 mx-auto mt-4 rounded-full"></div>
  </header>

  <!-- Video -->
  <div id="videoWrapper" class="video-container max-w-4xl w-full rounded-2xl overflow-hidden shadow-2xl cursor-pointer relative group">
    <video id="mainVideo" src="video.mp4" controls class="w-full h-auto rounded-2xl"></video>

    <!-- overlay glow effect -->
    <div class="absolute inset-0 opacity-0 group-hover:opacity-100 transition duration-500 bg-gradient-to-tr from-[rgba(0,255,157,0.1)] to-[rgba(255,204,0,0.1)] pointer-events-none"></div>
  </div>

  <!-- Footer -->
  <footer class="mt-10 text-center text-gray-500 text-sm select-none">
    <p class="mb-1">"Unconventional solutions to fundamental problems."</p>
    <p>© 2025 Elias A. de Moraes</p>
  </footer>

  <script>
    // Zoom toggle on video click
    const videoContainer = document.getElementById('videoWrapper');
    let zoomed = false;

    videoContainer.addEventListener('click', () => {
      zoomed = !zoomed;
      videoContainer.classList.toggle('zoomed', zoomed);
    });

    // Optional: click outside to unzoom
    document.addEventListener('click', (e) => {
      if (zoomed && !videoContainer.contains(e.target)) {
        zoomed = false;
        videoContainer.classList.remove('zoomed');
      }
    });
  </script>
</body>
</html>
